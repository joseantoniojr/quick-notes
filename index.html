<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <!-- Link CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <!-- Script App -->
    <script src="js/app.js" type="module"></script>
</head>

<body>
    <header class="header">
        <h1 class="header__title">Quick Notes</h1>

        <div class="header__actions">
            <button id="btn-add-note" class="btn btn--primary" type="button" aria-label="Adicionar nota">+ Add Nota</button>
            <button id="btn-favorite" class="btn btn--favorite is-active" type="button" aria-label="Favoritar nota">
                <svg height="24" width="24" viewBox="0 0 24 24" fill="gold">
                    <path d="M12 2.6a1 1 0 0 1 .9.6l2.4 4.8 5.3.8a1 1 0 0 1 .6 1.7l-3.8 3.8 1 5.3a1 1 0 0 1-1.4 1.1L12 18.2l-4.8 2.5a1 1 0 0 1-1.4-1.1l1-5.3-3.8-3.8a1 1 0 0 1 .6-1.7l5.3-.8 2.4-4.8a1 1 0 0 1 .9-.6z" stroke="gold" stroke-width="1.5" stroke-linejoin="round"
                        stroke-linecap="round" />
                </svg>
            </button>
            <button id="btn-toggle-theme" class="btn btn--theme" type="button" aria-label="Alterar tema">
                <svg height="24" width="24" viewBox="0 0 24 24" fill="orangered">
                    <circle cx="12" cy="12" r="5" fill="gold" />
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="gold" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </header>

    <main id="notes-container" class="notes-list">
        
    </main>

    <dialog id="modal-note" class="dialog">
        <div class="dialog__container">
            <header class="dialog__header">
                <h2 id="modal-note-title" class="dialog__title">Add Nova Nota</h2>

                <button id="btn-close-note" class="btn btn--close" aria-label="Fechar modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18.3 5.71c-.39-.39-1.02-.39-1.41 0L12 10.59 7.11 5.7c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0L12 13.41l4.89 4.88c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z">
                        </path>
                    </svg>
                </button>
            </header>

            <form id="note-form" class="dialog__form" method="dialog">
                <div class="form__field">
                    <label for="note-title">Título</label>
                    <input type="text" name="title" id="note-title" class="form__input" placeholder="Insira o título da nota..." required>
                </div>

                <div class="form__field">
                    <label for="note-content">Conteúdo</label>
                    <textarea name="content" id="note-content" class="form__textarea" placeholder="Escreva sua nota aqui..." required></textarea>
                </div>

                <div class="form__actions">
                    <button id="btn-cancel-note" class="btn btn--secondary" type="button">Cancelar</button>
                    <button id="btn-save-note" class="btn btn--primary" type="submit">Salvar Nota</button>
                </div>
            </form>
        </div>
    </dialog>

    <dialog id="modal-confirmation" class="dialog">
        <div class="dialog__container">
            <header class="dialog__header">
                <h2 id="modal-confirmation-title" class="dialog__title">Excluir Nota?</h2>

                <button id="btn-close-confirmation" class="btn btn--close" aria-label="Fechar modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18.3 5.71c-.39-.39-1.02-.39-1.41 0L12 10.59 7.11 5.7c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0L12 13.41l4.89 4.88c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z">
                        </path>
                    </svg>
                </button>
            </header>

            <div class="dialog__content">
                <p class="dialog__text">Tem certeza que deseja excluir a nota?<br> Essa ação não tem volta</p>
            </div>

            <footer class="form__actions">
                <button id="btn-cancel-confirmation" class="btn btn--secondary" type="button">Cancelar</button>
                <button id="btn-save-confirmation" class="btn btn--delete danger" type="button">Excluir</button>
            </footer>
        </div>
    </dialog>
</body>

</html>
